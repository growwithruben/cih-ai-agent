<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"/>

  <title>
    CIH OS Login
  </title>

  <link rel="icon" href="../assets/logo.png">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:Inter,Arial,sans-serif;

      background:
      radial-gradient(circle at top left,
      rgba(37,170,225,.18),
      transparent 30%),

      linear-gradient(
      180deg,
      #08111d 0%,
      #0b1727 100%);

      min-height:100vh;

      display:flex;
      align-items:center;
      justify-content:center;

      overflow:hidden;
      color:white;
    }

    .bg-glow{
      position:absolute;
      width:700px;
      height:700px;
      background:rgba(37,170,225,.18);
      border-radius:50%;
      filter:blur(120px);
      top:-200px;
      right:-200px;
    }

    .login-container{
      position:relative;
      z-index:2;

      width:100%;
      max-width:460px;

      background:
      rgba(255,255,255,.05);

      border:
      1px solid rgba(255,255,255,.08);

      backdrop-filter:blur(20px);

      border-radius:32px;

      padding:42px;

      box-shadow:
      0 25px 80px rgba(0,0,0,.45);
    }

    .logo{
      width:90px;
      height:auto;
      display:block;
      margin:0 auto 22px;
    }

    .eyebrow{
      text-align:center;
      color:#7dd3fc;
      text-transform:uppercase;
      letter-spacing:.14em;
      font-size:12px;
      font-weight:900;
      margin-bottom:14px;
    }

    h1{
      text-align:center;
      font-size:42px;
      letter-spacing:-0.06em;
      margin-bottom:10px;
    }

    .subtext{
      text-align:center;
      color:#9fb0c3;
      line-height:1.6;
      margin-bottom:34px;
      font-size:15px;
    }

    .field{
      margin-bottom:18px;
    }

    label{
      display:block;
      margin-bottom:8px;
      font-size:13px;
      font-weight:800;
      color:#cbd5e1;
    }

    input{
      width:100%;
      padding:16px 18px;

      border-radius:16px;

      border:
      1px solid rgba(255,255,255,.08);

      background:
      rgba(255,255,255,.06);

      color:white;

      font-size:15px;
      outline:none;
    }

    input::placeholder{
      color:#7f91a8;
    }

    input:focus{
      border-color:#25aae1;
      box-shadow:
      0 0 0 4px rgba(37,170,225,.15);
    }

    .login-btn{
      width:100%;
      border:none;

      padding:16px;

      border-radius:18px;

      background:
      linear-gradient(
      135deg,
      #25aae1,
      #0C6489);

      color:white;

      font-size:16px;
      font-weight:900;

      cursor:pointer;

      margin-top:10px;

      transition:.2s ease;
    }

    .login-btn:hover{
      transform:translateY(-2px);
      box-shadow:
      0 18px 40px rgba(37,170,225,.35);
    }

    .bottom{
      margin-top:24px;
      text-align:center;
      font-size:13px;
      color:#7f91a8;
    }

    .ai-badge{
      width:58px;
      height:58px;

      border-radius:18px;

      background:#101827;

      color:#25aae1;

      display:grid;
      place-items:center;

      font-weight:950;
      font-size:20px;

      margin:0 auto 24px;

      box-shadow:
      0 10px 24px rgba(0,0,0,.18);
    }

    @media (max-width:520px){

      .login-container{
        margin:20px;
        padding:32px 24px;
      }

      h1{
        font-size:34px;
      }

    }

  </style>
</head>

<body>

  <div class="bg-glow"></div>

  <div class="login-container">

    <img
      src="../assets/logo.png"
      class="logo"
      alt="City Insight Houston Logo">

    <div class="ai-badge">
      AI
    </div>

    <div class="eyebrow">
      Internal System Access
    </div>

    <h1>
      CIH OS
    </h1>

    <div class="subtext">
      SOP Intelligence System for City Insight Houston agents,
      leadership, operations, recruiting, and compliance.
    </div>

    <div class="field">

      <label>
        Email Address
      </label>

      <input
        type="email"
        placeholder="you@cityinsighthouston.com">

    </div>

    <div class="field">

      <label>
        Password
      </label>

      <input
        type="password"
        placeholder="Enter password">

    </div>

    <button
      class="login-btn"
      onclick="window.location.href='../index.html'">

      Login to CIH OS

    </button>

    <div class="bottom">
      Internal Use Only © City Insight Houston 2026
    </div>

  </div>

</body>
</html>
